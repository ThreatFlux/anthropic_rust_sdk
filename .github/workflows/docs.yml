name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Pull request runs are superseded by newer pushes. Every other run gets its
# own per-commit group, so each main commit gets a result; the deploy job has
# its own group so gh-pages deploys never overlap.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

permissions:
  contents: read

jobs:
  contract:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate README metadata, quickstart, and local links
        run: python3 scripts/check_docs.py

      - name: Create markdownlint configuration
        id: markdownlint-config
        shell: bash
        run: |
          config_path="${RUNNER_TEMP}/markdownlint.jsonc"
          printf '%s\n' \
            '{' \
            '  "MD013": false,' \
            '  "MD024": { "siblings_only": true },' \
            '  "MD034": false' \
            '}' > "${config_path}"
          echo "path=${config_path}" >> "${GITHUB_OUTPUT}"

      - name: Lint maintained Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: ${{ steps.markdownlint-config.outputs.path }}
          globs: |
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md

  quickstart:
    name: Quickstart (${{ matrix.channel }})
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [msrv, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Rust toolchain
        id: toolchain
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          if [[ "${CHANNEL}" == "msrv" ]]; then
            value="$(python3 scripts/check_docs.py --print-msrv)"
          else
            value="stable"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.value }}

      - name: Compile quickstart
        run: cargo check --example quickstart
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.value }}

  build-docs:
    name: Build Documentation
    needs: [contract, quickstart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly

      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"

      - name: Add redirect index.html
        run: |
          echo '<meta http-equiv="refresh" content="0; url=threatflux_anthropic_sdk/index.html">' > target/doc/index.html

      - name: Upload documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdoc
          path: target/doc
          if-no-files-found: error
          retention-days: 1

  # Only this job can write, and only for pushes to main: it publishes the
  # documentation built above to the gh-pages branch.
  deploy-docs:
    name: Deploy Documentation
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pushes the gh-pages branch.
    steps:
      - name: Download documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdoc
          path: doc

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation'
