name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  contract:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate README metadata, quickstart, and local links
        run: python3 scripts/check_docs.py

      - name: Create markdownlint configuration
        id: markdownlint-config
        shell: bash
        run: |
          config_path="${RUNNER_TEMP}/markdownlint.jsonc"
          printf '%s\n' \
            '{' \
            '  "MD013": false,' \
            '  "MD024": { "siblings_only": true },' \
            '  "MD034": false' \
            '}' > "${config_path}"
          echo "path=${config_path}" >> "${GITHUB_OUTPUT}"

      - name: Lint maintained Markdown
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          config: ${{ steps.markdownlint-config.outputs.path }}
          globs: |
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md

  quickstart:
    name: Quickstart (${{ matrix.channel }})
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [msrv, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Rust toolchain
        id: toolchain
        shell: bash
        run: |
          if [[ "${{ matrix.channel }}" == "msrv" ]]; then
            value="$(python3 scripts/check_docs.py --print-msrv)"
          else
            value="stable"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.value }}

      - name: Compile quickstart
        run: cargo check --example quickstart

  build-docs:
    name: Build Documentation
    needs: [contract, quickstart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: nightly
      
      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"
      
      - name: Add redirect index.html
        run: |
          echo '<meta http-equiv="refresh" content="0; url=threatflux_anthropic_sdk/index.html">' > target/doc/index.html
      
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation'
